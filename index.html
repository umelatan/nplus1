  },
  'picker-prev-month': () => { let mo = state.ui.modal.pickerMonth - 1, y = state.ui.modal.pickerYear; if (mo < 0) { mo = 11; y--; } state.ui.modal.pickerMonth = mo; state.ui.modal.pickerYear = y; rerender(); },
  'picker-next-month': () => { let mo = state.ui.modal.pickerMonth + 1, y = state.ui.modal.pickerYear; if (mo > 11) { mo = 0; y++; } state.ui.modal.pickerMonth = mo; state.ui.modal.pickerYear = y; rerender(); },
  'picker-select-day': (ds) => { state.ui.modal.date = ds.date; rerender(); },
  'open-swap': (ds) => { const sc = state.scheduledSessions.find(x => x.id === ds.id); state.ui.modal = { type: 'swap-sequence', id: ds.id, sequenceId: sc.sequenceId }; rerender(); },
  'open-cancel-scheduled': (ds) => { state.ui.modal = { type: 'cancel-scheduled-confirm', id: ds.id }; rerender(); },
  'cancel-scheduled-confirm': (ds) => {
    state.scheduledSessions = state.scheduledSessions.filter(sc => sc.id !== ds.id);
    state.ui.modal = null; saveState(); rerender();
  },
  'schedule-confirm': () => {
    const date = state.ui.modal.date, sequenceId = $('#f-seq').value;
    state.scheduledSessions.push({ id: uid('sch'), sequenceId, date, plannedBy: state.role, status: 'planned', note: '' });
    state.ui.calSelectedDate = date; state.ui.modal = null; saveState(); rerender();
  },
  'reschedule-confirm': (ds) => { const sc = state.scheduledSessions.find(x => x.id === ds.id); sc.date = state.ui.modal.date; state.ui.modal = null; saveState(); rerender(); },
  'swap-sequence-confirm': (ds) => { const sc = state.scheduledSessions.find(x => x.id === ds.id); sc.sequenceId = $('#f-seq').value; state.ui.modal = null; saveState(); rerender(); },

  'open-start-picker': () => { state.ui.modal = { type: 'start-workout-pick' }; rerender(); },
  'start-workout': (ds) => {
    if (state.activeSession) { state.ui.modal = { type: 'discard-confirm', sequenceId: ds.sequenceId, scheduledId: ds.scheduledId || null }; rerender(); return; }
    state.ui.modal = null; beginWorkout(ds.sequenceId, ds.scheduledId || null);
  },
  'discard-and-start': (ds) => { state.activeSession = null; state.ui.modal = null; beginWorkout(ds.sequenceId, ds.scheduledId || null); },
  'open-finish': () => { state.ui.modal = { type: 'finish-workout' }; rerender(); },
  'finish-workout-confirm': () => {
    if (sessionCustomized(state.activeSession)) { state.ui.modal = { type: 'finish-save-choice' }; rerender(); return; }
    finalizeActiveSession();
  },
  'finish-save-choice-confirm': (ds) => {
    const s = state.activeSession;
    if (ds.choice === 'existing') {
      const seq = getSequence(s.sequenceId);
      if (seq) seq.exercises = s.exercises.map(sequenceExerciseFromSessionBlock);
    } else if (ds.choice === 'new') {
      const seq = getSequence(s.sequenceId);
      const newSeq = { id: uid('seq'), name: (seq ? seq.name : s.sequenceName) + ' (Updated)', description: seq ? seq.description : '', archived:false, draft:false, createdAt: todayISO(), createdBy: state.role, exercises: s.exercises.map(sequenceExerciseFromSessionBlock) };
      state.sequences.push(newSeq);
    }
    finalizeActiveSession();
  },
  'open-cancel-session': () => { state.ui.modal = { type: 'cancel-session-confirm' }; rerender(); },
  'cancel-session-confirm': () => {
    state.activeSession = null; state.ui.modal = null; saveState();
    navigate('#/home');
  },
  'use-last-workout': (ds) => {
    const exIdx = Number(ds.exIdx); const e = state.activeSession.exercises[exIdx];
    const prev = findPreviousExerciseBlock(e.exerciseId, state.activeSession.date, null);
    if (!prev) return;
    prev.block.sets.forEach((pSet, i) => {
      const cur = e.sets[i]; if (!cur) return;
      cur.weight = pSet.weight; cur.weightLeft = pSet.weightLeft; cur.weightRight = pSet.weightRight;
      cur.reps = pSet.reps; cur.repsLeft = pSet.repsLeft; cur.repsRight = pSet.repsRight;
      cur.intensityMethod = pSet.intensityMethod; cur.intensityValue = pSet.intensityValue;
      cur.intensityMethodLeft = pSet.intensityMethodLeft; cur.intensityValueLeft = pSet.intensityValueLeft;
      cur.intensityMethodRight = pSet.intensityMethodRight; cur.intensityValueRight = pSet.intensityValueRight;
      (pSet.drops || []).forEach((pd, di) => { if (cur.drops[di]) {
        cur.drops[di].weight = pd.weight; cur.drops[di].weightLeft = pd.weightLeft; cur.drops[di].weightRight = pd.weightRight;
        cur.drops[di].reps = pd.reps; cur.drops[di].repsLeft = pd.repsLeft; cur.drops[di].repsRight = pd.repsRight;
        cur.drops[di].intensityMethod = pd.intensityMethod; cur.drops[di].intensityValue = pd.intensityValue;
        cur.drops[di].intensityMethodLeft = pd.intensityMethodLeft; cur.drops[di].intensityValueLeft = pd.intensityValueLeft;
        cur.drops[di].intensityMethodRight = pd.intensityMethodRight; cur.drops[di].intensityValueRight = pd.intensityValueRight;
      } });
    });
    saveState(); rerender();
  },
  'add-set': (ds) => {
    const e = state.activeSession.exercises[Number(ds.exIdx)];
    const last = e.sets[e.sets.length - 1];
    e.sets.push({ id: uid('set'), type: 'working', weight: last ? last.weight : null, weightLeft: last ? last.weightLeft : null, weightRight: last ? last.weightRight : null, reps: last ? last.reps : null, repsLeft: last ? last.repsLeft : null, repsRight: last ? last.repsRight : null, intensityMethod: last ? last.intensityMethod : 'rpe', intensityValue: null, intensityMethodLeft: last ? last.intensityMethodLeft : 'rpe', intensityValueLeft: null, intensityMethodRight: last ? last.intensityMethodRight : 'rpe', intensityValueRight: null, note: '', completed: false, drops: [] });
    saveState(); rerender();
  },
  'add-drop': (ds) => {
    const e = state.activeSession.exercises[Number(ds.exIdx)];
    const setIdx = (ds.setIdx !== undefined && ds.setIdx !== '') ? Number(ds.setIdx) : e.sets.length - 1;
    if (setIdx < 0) return;
    const parent = e.sets[setIdx];
    const lastDrop = parent.drops[parent.drops.length - 1];
    const scale = (v) => v != null ? round1(v * 0.8) : null;
    const baseW = lastDrop ? lastDrop.weight : parent.weight;
    const baseWL = lastDrop ? lastDrop.weightLeft : parent.weightLeft;
    const baseWR = lastDrop ? lastDrop.weightRight : parent.weightRight;
    parent.drops.push({ id: uid('set'), type: 'drop', weight: scale(baseW), weightLeft: scale(baseWL), weightRight: scale(baseWR), reps: null, repsLeft: null, repsRight: null, intensityMethod: parent.intensityMethod, intensityValue: null, intensityMethodLeft: parent.intensityMethodLeft, intensityValueLeft: null, intensityMethodRight: parent.intensityMethodRight, intensityValueRight: null, note: '', completed: false });
    saveState(); rerender();
  },
  'remove-set': (ds) => { state.activeSession.exercises[Number(ds.exIdx)].sets.splice(Number(ds.setIdx), 1); saveState(); rerender(); },
  'remove-drop': (ds) => { state.activeSession.exercises[Number(ds.exIdx)].sets[Number(ds.setIdx)].drops.splice(Number(ds.dropIdx), 1); saveState(); rerender(); },
  'set-cycle-type': (ds) => { const s = state.activeSession.exercises[Number(ds.exIdx)].sets[Number(ds.setIdx)]; s.type = s.type === 'working' ? 'warmup' : 'working'; saveState(); rerender(); },
  'adj': (ds) => {
    const path = ds.path, delta = Number(ds.delta), min = (ds.min !== undefined && ds.min !== '') ? Number(ds.min) : null;
    let vOld = getPath(state, path); vOld = (vOld == null || vOld === '' || isNaN(Number(vOld))) ? null : Number(vOld);
    let v = round1((vOld || 0) + delta); if (min != null) v = Math.max(min, v);
    setPath(state, path, v);
    saveState(); rerender();
  },
  'set-intensity-method': (ds) => { setPath(state, ds.basePath + '.' + (ds.key || 'intensityMethod'), ds.method); setPath(state, ds.basePath + '.' + (ds.valueKey || 'intensityValue'), null); saveState(); rerender(); },
  'set-intensity-value': (ds) => { setPath(state, ds.basePath + '.' + (ds.methodKey || 'intensityMethod'), ds.method); setPath(state, ds.basePath + '.' + (ds.key || 'intensityValue'), ds.value === 'failure' ? 'failure' : Number(ds.value)); saveState(); rerender(); },

  'new-sequence': () => { const seq = { id: uid('seq'), name: 'New Sequence', description: '', archived: false, draft: true, createdAt: todayISO(), createdBy: state.role, exercises: [] }; state.sequences.push(seq); saveState(); navigate('#/sequences/' + seq.id); },
  'save-sequence-draft': (ds) => { const seq = getSequence(ds.id); seq.draft = false; saveState(); rerender(); },
  'duplicate-sequence': (ds) => { const seq = getSequence(ds.id); const copy = clone(seq); copy.id = uid('seq'); copy.name = seq.name + ' (Copy)'; copy.archived = false; copy.exercises.forEach(e => e.id = uid('sqx')); state.sequences.push(copy); saveState(); rerender(); },
  'archive-toggle': (ds) => { getSequence(ds.id).archived = !getSequence(ds.id).archived; saveState(); rerender(); },
  'open-delete-sequence': (ds) => { state.ui.modal = { type: 'delete-sequence-confirm', id: ds.id }; rerender(); },
  'delete-sequence-confirm': (ds) => {
    state.sequences = state.sequences.filter(s => s.id !== ds.id);
    state.scheduledSessions = state.scheduledSessions.filter(sc => sc.sequenceId !== ds.id);
    state.ui.modal = null;
    saveState();
    const r = route();
    if (r.parts[0] === 'sequences' && r.parts[1] === ds.id) navigate('#/sequences'); else rerender();
  },
  'draft-nav-save': () => { const href = state.ui.modal.targetHref; state.ui.modal = null; navigate(href); },
  'draft-nav-discard': () => {
    const id = state.ui.modal.id, href = state.ui.modal.targetHref;
    state.sequences = state.sequences.filter(s => s.id !== id);
    state.scheduledSessions = state.scheduledSessions.filter(sc => sc.sequenceId !== id);
    state.ui.modal = null;
    saveState();
    navigate(href);
  },
  'open-rename': (ds) => { state.ui.modal = { type: 'rename-sequence', id: ds.id, name: getSequence(ds.id).name }; rerender(); },
  'start-inline-rename': (ds) => { state.ui.inlineRenameSeqId = ds.id; state.ui.inlineRenameDraft = null; state.ui.inlineRenameError = null; rerender(); },
  'cancel-inline-rename': () => { state.ui.inlineRenameSeqId = null; state.ui.inlineRenameDraft = null; state.ui.inlineRenameError = null; rerender(); },
  'confirm-inline-rename': (ds) => {
    const input = document.getElementById('f-inline-rename-' + ds.id);
    const name = input ? input.value.trim() : '';
    if (!name) { state.ui.inlineRenameSeqId = null; state.ui.inlineRenameDraft = null; state.ui.inlineRenameError = null; rerender(); return; }
    if (sequenceNameTaken(name, ds.id)) {
      state.ui.inlineRenameDraft = name;
      state.ui.inlineRenameError = 'A sequence with this name already exists.';
      rerender(); return;
    }
    getSequence(ds.id).name = name;
    state.ui.inlineRenameSeqId = null; state.ui.inlineRenameDraft = null; state.ui.inlineRenameError = null; saveState(); rerender();
  },
  'rename-sequence-confirm': (ds) => {
    const name = $('#f-rename').value.trim();
    if (!name) { state.ui.modal = null; rerender(); return; }
    if (sequenceNameTaken(name, ds.id)) { state.ui.modal.name = name; state.ui.modal.error = 'A sequence with this name already exists.'; rerender(); return; }
    getSequence(ds.id).name = name; state.ui.modal = null; saveState(); rerender();
  },
  'toggle-seq-ex': (ds) => { const idx = Number(ds.idx); state.ui.expandedSeqExIdx = state.ui.expandedSeqExIdx === idx ? null : idx; rerender(); },
  'toggle-history-row': (ds) => { state.ui.expandedHistorySessionId = state.ui.expandedHistorySessionId === ds.id ? null : ds.id; rerender(); },
  'open-add-exercise': (ds) => { state.ui.modal = { type: 'add-exercise-to-sequence', seqId: ds.seqId, q: '' }; rerender(); },
  'add-exercise-confirm': (ds) => {
    const seq = getSequence(ds.seqId), ex = getExercise(ds.exerciseId);
    seq.exercises.push({ id: uid('sqx'), exerciseId: ex.id, prescription: { sets: 1, repLow: ex.defaultRepLow, repHigh: ex.defaultRepHigh, targetWeight: null, intensityMethod: 'rpe', intensityTarget: 8, restSeconds: 75, notes: '', drops: [] } });
    state.ui.modal = null; saveState(); rerender();
  },
  'open-add-exercise-session': () => { state.ui.modal = { type: 'session-exercise-picker', mode: 'add', q: '' }; rerender(); },
  'open-swap-exercise-session': (ds) => { state.ui.modal = { type: 'session-exercise-picker', mode: 'swap', exIdx: Number(ds.exIdx), q: '' }; rerender(); },
  'session-exercise-pick-confirm': (ds) => {
    const block = buildSessionExercise(ds.exerciseId, null);
    if (ds.mode === 'swap') state.activeSession.exercises[Number(ds.exIdx)] = block;
    else state.activeSession.exercises.push(block);
    state.ui.modal = null; saveState(); rerender();
  },
  'open-new-exercise': (ds) => {
    const prev = state.ui.modal;
    state.ui.modal = { type: 'new-exercise', seqId: ds.seqId || (prev && prev.seqId) || '',
      mode: ds.mode || (prev && prev.mode) || '', exIdx: (ds.exIdx !== undefined && ds.exIdx !== '') ? ds.exIdx : (prev && prev.exIdx) };
    rerender();
  },
  'new-exercise-save': (ds) => {
    const name = $('#nf-name').value.trim(); if (!name) return;
    const ex = { id: uid('ex'), name, category: $('#nf-category').value, equipment: $('#nf-equipment').value, laterality: $('#nf-laterality').value, loadType: $('#nf-loadtype').value, defaultRepLow: 8, defaultRepHigh: 12, notes: '', custom: true };
    state.exercises.push(ex);
    if (ds.mode === 'add') { state.activeSession.exercises.push(buildSessionExercise(ex.id, null)); }
    else if (ds.mode === 'swap') { state.activeSession.exercises[Number(ds.exIdx)] = buildSessionExercise(ex.id, null); }
    else if (ds.seqId) { const seq = getSequence(ds.seqId); seq.exercises.push({ id: uid('sqx'), exerciseId: ex.id, prescription: { sets: 1, repLow: ex.defaultRepLow, repHigh: ex.defaultRepHigh, targetWeight: null, intensityMethod: 'rpe', intensityTarget: 8, restSeconds: 75, notes: '', drops: [] } }); }
    state.ui.modal = null; saveState(); rerender();
  },
  'set-exercise-laterality': (ds, el) => { const ex = getExercise(ds.exerciseId); ex.laterality = el.value; saveState(); rerender(); },
  'add-drop-preset': (ds) => { getSequence(ds.seqId).exercises[Number(ds.idx)].prescription.drops.push({ weight: null, reps: null }); saveState(); rerender(); },
  'remove-drop-preset': (ds) => { getSequence(ds.seqId).exercises[Number(ds.idx)].prescription.drops.splice(Number(ds.dropIdx), 1); saveState(); rerender(); },
  'move-exercise': (ds) => {
    const seq = getSequence(ds.seqId), idx = Number(ds.idx), j = idx + Number(ds.dir);
    if (j < 0 || j >= seq.exercises.length) return;
    [seq.exercises[idx], seq.exercises[j]] = [seq.exercises[j], seq.exercises[idx]];
    state.ui.expandedSeqExIdx = j; saveState(); rerender();
  },
  'remove-exercise': (ds) => { getSequence(ds.seqId).exercises.splice(Number(ds.idx), 1); state.ui.expandedSeqExIdx = null; saveState(); rerender(); },

  'lib-filter-cat': (ds) => { state.ui.libCategory = ds.cat; rerender(); },
  'history-tab': (ds) => { state.ui.historyTab = ds.tab; rerender(); },
  'history-month-toggle': () => {
    const months = historyMonths();
    state.ui.historyFilterMonth = state.ui.historyFilterMonth === 'all' ? (months[0] || 'all') : 'all';
    rerender();
  },
  'history-month-prev': () => {
    const months = historyMonths();
    const idx = months.indexOf(state.ui.historyFilterMonth);
    if (idx !== -1 && idx < months.length - 1) { state.ui.historyFilterMonth = months[idx+1]; rerender(); }
  },
  'history-month-next': () => {
    const months = historyMonths();
    const idx = months.indexOf(state.ui.historyFilterMonth);
    if (idx > 0) { state.ui.historyFilterMonth = months[idx-1]; rerender(); }
  },
  'mark-reviewed': (ds) => {
    const s = state.workoutSessions.find(w => w.id === ds.id);
    s.reviewedByTrainer = true; saveState(); rerender();
  },
};

/* ================= GLOBAL EVENT WIRING ================= */
document.addEventListener('click', (e) => {
  const navEl = e.target.closest('a[href^="#"], [data-action="go"]');
  if (navEl) {
    const targetHref = navEl.tagName === 'A' ? navEl.getAttribute('href') : navEl.dataset.href;
    if (targetHref && targetHref !== (location.hash || '#/home')) {
      const guardSeq = draftNavGuardSequence();
      if (guardSeq) {
        e.preventDefault();
        state.ui.modal = { type: 'draft-nav-confirm', id: guardSeq.id, targetHref };
        rerender();
        return;
      }
      const emptySeq = emptyDraftOnCurrentPage();
      if (emptySeq) {
        state.sequences = state.sequences.filter(s => s.id !== emptySeq.id);
        state.scheduledSessions = state.scheduledSessions.filter(sc => sc.sequenceId !== emptySeq.id);
        saveState();
      }
    }
  }
  const el = e.target.closest('[data-action]');
  // <select> elements fire 'click' just to open their native options list — that's
  // not a selection. Acting on it here forces a re-render mid-interaction, which
  // yanks the element out from under the open dropdown (it blinks and won't stay
  // open). Selects are driven by the 'change' listener below instead.
  if (!el || el.tagName === 'SELECT') {
    if (!el && state.ui.profileMenuOpen && !e.target.closest('header')) { state.ui.profileMenuOpen = false; rerender(); }
    return;
  }
  e.preventDefault();
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset, el);
});

function sanitizeNumericInput(raw) {
  let s = raw.replace(/[^0-9.]/g, '');
  const firstDot = s.indexOf('.');
  if (firstDot !== -1) s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
  return s;
}
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.matches) return;
  if (el.matches('[data-bind]')) {
    let raw = el.value;
    if (el.dataset.type === 'number') {
      const clean = sanitizeNumericInput(raw);
      if (clean !== raw) { el.value = clean; raw = clean; }
    }
    let val = raw;
    if (el.dataset.type === 'number') val = val === '' ? null : Number(val);
    setPath(state, el.dataset.bind, val);
    saveState(); rerender();
  } else if (el.matches('[data-action-input]')) {
    const key = el.dataset.actionInput;
    if (key === 'lib-search') state.ui.libSearch = el.value;
    else if (key === 'lib-pick-search' && state.ui.modal) state.ui.modal.q = el.value;
    rerender();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (!el.matches) return;
  if (el.matches('[data-action-change]')) {
    const key = el.dataset.actionChange;
    if (key === 'history-filter-ex') { state.ui.historyFilterExercise = el.value; saveState(); }
    rerender();
  } else if (el.matches('select[data-action]')) {
    const fn = actions[el.dataset.action];
    if (fn) fn(el.dataset, el);
  }
});

/* ================= TICKERS ================= */
setInterval(() => {
  if (!state.activeSession) return;
  const t = document.getElementById('session-timer');
  if (t) t.textContent = fmtDuration((Date.now() - state.activeSession.startedAt) / 1000);
}, 1000);

/* this module's top-level declarations aren't global — expose what a handful of
   inline HTML attribute handlers (e.g. the inline-rename input's onkeydown) need */
window.actions = actions;

</script>
</body>
</html>
