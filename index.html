<script type="module">
/* ===================== N+1 — Tandem Strength ===================== */
'use strict';

/* ---------- Firebase ---------- */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getDatabase, ref, set, update, get, onValue, off }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBts79Ln9i1QytGYZaznOVJMhUcj2GrHkg",
  authDomain: "n-plus1.firebaseapp.com",
  databaseURL: "https://n-plus1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "n-plus1",
  storageBucket: "n-plus1.firebasestorage.app",
  messagingSenderId: "1018311523936",
  appId: "1:1018311523936:web:0caac2df9ee0de41f00d05"
};
const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const db = getDatabase(fbApp);
const googleProvider = new GoogleAuthProvider();
const ADMIN_EMAILS = ['nurnasuhaa@gmail.com', 'shaf.r210003@gmail.com'];
function emailKey(email) { return (email || '').toLowerCase().trim().replace(/\./g, ','); }
function arrayToObj(arr) { const o = {}; (arr || []).forEach(item => { if (item && item.id) o[item.id] = item; }); return o; }

/* ---------- tiny utils ---------- */
let _uid = 1;
const uid = (p) => `${p}_${Date.now().toString(36)}_${(_uid++).toString(36)}`;
const clone = (o) => JSON.parse(JSON.stringify(o));
const round1 = (n) => Math.round(n * 10) / 10;
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (base, n) => { const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtShort(dateStr) { const d = new Date(dateStr + 'T00:00:00'); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function fmtFull(dateStr) { const d = new Date(dateStr + 'T00:00:00'); const wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; return `${wd[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function monthKey(dateStr) { return dateStr.slice(0,7); }
function monthLabel(key) { const [y,m] = key.split('-').map(Number); return `${MONTHS[m-1].slice(0,3)} ${y}`; }
function fmtDuration(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return `${m}:${String(s).padStart(2,'0')}`; }
function fmtMinutes(sec) { return `${Math.round(sec/60)} min`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getPath(obj, path) { return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, value) { const keys = path.split('.'); let o = obj; for (let i=0;i<keys.length-1;i++) o = o[keys[i]]; o[keys[keys.length-1]] = value; }
function $(sel, root=document){ return root.querySelector(sel); }
function $all(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }

const CATEGORIES = ['Chest','Back','Shoulders','Legs','Arms','Core'];

/* ---------- state ---------- */
function freshUiState() {
  let theme = 'light';
  try { theme = localStorage.getItem('n1_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e) {}
  return {
    calYear: new Date().getFullYear(), calMonth: new Date().getMonth(), calSelectedDate: todayISO(), calView:'month',
    historyTab:'sessions', historyFilterMonth:'all', historyFilterExercise: null,
    libSearch:'', libCategory:'all', modal:null, expandedSeqExIdx:null, expandedHistorySessionId:null,
    inlineRenameSeqId:null, inlineRenameDraft:null, inlineRenameError:null, profileMenuOpen:false,
    adminWhitelist:null, adminTraineesByTrainer:null, adminLoaded:false, adminLoadError:null,
    theme,
  };
}
let state = {
  booting: true,
  authUser: null,
  isAdmin: false,
  notAuthorized: false,
  myBaseRole: null,
  myTrainees: [],
  viewingTraineeUid: null,
  role: 'client',
  users: { trainer: { id:null, name:'' }, client: { id:null, name:'' } },
  exercises: [], sequences: [], scheduledSessions: [], workoutSessions: [],
  activeSession: null,
  ui: freshUiState(),
};

/* ---------- persistence (Firebase-backed) ---------- */
let dataListeners = [];
/* a single update() touching multiple collections fires one onValue callback per
   collection in quick succession — rendering on each one individually is both
   wasteful (several full re-renders for one logical change) and unsafe (a render
   can land between two of those callbacks, when e.g. sequences has the new data
   but exercises doesn't yet, and a row referencing a not-yet-synced exercise
   would crash). Debounce them into a single focus-preserving rerender() instead. */
let dataRenderTimer = null;
function scheduleDataRender() {
  if (state.booting) return;
  clearTimeout(dataRenderTimer);
  dataRenderTimer = setTimeout(() => { rerender(); }, 120);
}
let lastSyncedJson = { exercises:null, sequences:null, scheduledSessions:null, workoutSessions:null };
function detachDataListeners() { dataListeners.forEach(({ref:r, cb}) => off(r, 'value', cb)); dataListeners = []; clearTimeout(dataRenderTimer); }
function attachDataListeners(traineeUid) {
  detachDataListeners();
  lastSyncedJson = { exercises:null, sequences:null, scheduledSessions:null, workoutSessions:null };
  ['exercises','sequences','scheduledSessions','workoutSessions'].forEach(key => {
    const r = ref(db, `userData/${traineeUid}/${key}`);
    const cb = onValue(r, snap => {
      const obj = snap.val() || {};
      state[key] = Object.values(obj);
      lastSyncedJson[key] = JSON.stringify(arrayToObj(state[key]));
      scheduleDataRender();
    });
    dataListeners.push({ ref:r, cb });
  });
  try {
    const raw = localStorage.getItem(`n1_active_${traineeUid}`);
    state.activeSession = raw ? JSON.parse(raw) : null;
  } catch(e) { state.activeSession = null; }
}
function setViewingTrainee(traineeUid, traineeName) {
  state.viewingTraineeUid = traineeUid;
  state.users.client = { id: traineeUid, name: traineeName || '' };
  attachDataListeners(traineeUid);
}
let fbSyncTimer = null;
function syncToFirebase() {
  if (!state.viewingTraineeUid) return;
  clearTimeout(fbSyncTimer);
  fbSyncTimer = setTimeout(() => {
    /* only write collections that actually changed since the last sync — most
       edits touch one collection, so this avoids re-uploading (and re-echoing
       back through the listeners above) the other three on every keystroke */
    const payload = {};
    ['exercises','sequences','scheduledSessions','workoutSessions'].forEach(key => {
      const json = JSON.stringify(arrayToObj(state[key]));
      if (json !== lastSyncedJson[key]) { payload[key] = JSON.parse(json); lastSyncedJson[key] = json; }
    });
    if (Object.keys(payload).length === 0) return;
    update(ref(db, `userData/${state.viewingTraineeUid}`), payload).catch(e => console.error('Firebase sync failed', e));
  }, 500);
}
function saveState() {
  if (state.viewingTraineeUid) {
    try {
      if (state.activeSession) localStorage.setItem(`n1_active_${state.viewingTraineeUid}`, JSON.stringify(state.activeSession));
      else localStorage.removeItem(`n1_active_${state.viewingTraineeUid}`);
    } catch(e) {}
  }
  syncToFirebase();
}

/* ---------- auth ---------- */
async function resolveAccess(user) {
  const ek = emailKey(user.email);
  const isAdmin = ADMIN_EMAILS.includes(user.email);
  await set(ref(db, `users/${user.uid}`), {
    email: user.email, displayName: user.displayName || user.email, photoURL: user.photoURL || '', lastLoginAt: Date.now(),
  });
  const wlSnap = await get(ref(db, `whitelist/${ek}`));
  const wl = wlSnap.val();
  if (wl && !wl.uid) { try { await update(ref(db, `whitelist/${ek}`), { uid: user.uid }); } catch(e) {} }
  if (!wl && !isAdmin) { state.notAuthorized = true; state.booting = false; render(); return; }

  state.isAdmin = isAdmin;
  state.myBaseRole = wl ? wl.role : null;
  state.myTrainees = [];
  state.users.trainer = { id:null, name:'' };
  state.users.client = { id:null, name:'' };
  state.viewingTraineeUid = null;

  if (state.myBaseRole === 'trainee') {
    state.role = 'client';
    setViewingTrainee(user.uid, user.displayName || user.email);
    const tIdxSnap = await get(ref(db, `traineeIndex/${user.uid}`));
    const trainerUids = Object.keys(tIdxSnap.val() || {});
    if (trainerUids.length) {
      const tSnap = await get(ref(db, `users/${trainerUids[0]}`));
      const t = tSnap.val();
      state.users.trainer = { id: trainerUids[0], name: t ? (t.displayName || t.email) : 'Trainer' };
    } else {
      state.users.trainer = { id: null, name: 'No trainer assigned yet' };
    }
  } else if (state.myBaseRole === 'trainer') {
    state.users.trainer = { id: user.uid, name: user.displayName || user.email };
    const idxSnap = await get(ref(db, `trainerIndex/${user.uid}`));
    const traineeUids = Object.keys(idxSnap.val() || {});
    const trainees = [];
    for (const tUid of traineeUids) {
      const uSnap = await get(ref(db, `users/${tUid}`));
      const u = uSnap.val();
      trainees.push({ uid: tUid, name: u ? (u.displayName || u.email) : tUid });
    }
    state.myTrainees = trainees;
    if (trainees.length) { state.role = 'trainer'; setViewingTrainee(trainees[0].uid, trainees[0].name); }
  }

  state.booting = false;
  render();
}

onAuthStateChanged(fbAuth, (user) => {
  detachDataListeners();
  if (!user) {
    state.authUser = null; state.booting = false; state.notAuthorized = false;
    state.isAdmin = false; state.myBaseRole = null; state.myTrainees = [];
    state.viewingTraineeUid = null; state.exercises = []; state.sequences = [];
    state.scheduledSessions = []; state.workoutSessions = []; state.activeSession = null;
    state.users = { trainer: { id:null, name:'' }, client: { id:null, name:'' } };
    render();
    return;
  }
  state.authUser = { uid: user.uid, email: user.email, displayName: user.displayName, photoURL: user.photoURL };
  state.booting = true; state.notAuthorized = false;
  render();
  resolveAccess(user);
});

/* ---------- domain helpers ---------- */
function getExercise(id) { return state.exercises.find(e => e.id === id); }
function getSequence(id) { return state.sequences.find(s => s.id === id); }
function sequenceNameTaken(name, excludeId) {
  const n = name.trim().toLowerCase();
  return state.sequences.some(s => s.id !== excludeId && s.name.trim().toLowerCase() === n);
}
function otherRole() { return state.role === 'client' ? 'trainer' : 'client'; }
function currentUser() { return state.users[state.role]; }
function otherUser() { return state.users[otherRole()]; }
function roleName(r) { return state.users[r].name; }

function upcomingScheduled() {
  return state.scheduledSessions.filter(s => s.status === 'planned' && s.date >= todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
}
function completedSessionsSorted() {
  return [...state.workoutSessions].sort((a,b)=> b.date.localeCompare(a.date));
}
function sessionsAwaitingReview() {
  return completedSessionsSorted().filter(s => !s.reviewedByTrainer);
}
/* top (first) working set of an exercise block, ignoring warmups */
function topWorkingSet(exBlock) {
  if (!exBlock) return null;
  return exBlock.sets.find(s => s.type === 'working') || exBlock.sets[0] || null;
}
function repsOf(set) {
  if (!set) return null;
  if (set.repsLeft != null || set.repsRight != null) return ((set.repsLeft||0) + (set.repsRight||0)) / 2;
  return set.reps;
}
function weightOf(set) {
  if (!set) return null;
  if (set.weightLeft != null || set.weightRight != null) return ((set.weightLeft||0) + (set.weightRight||0)) / 2;
  return set.weight;
}
function intensityNum(set, side='') {
  const val = set ? set['intensityValue'+side] : null;
  if (val == null) return null;
  if (val === 'failure') return 11;
  if (set['intensityMethod'+side] === 'rir') return 10 - Number(val);
  return Number(val);
}
/* most recent completed session (before given date, excluding a session id) containing exerciseId */
function findPreviousExerciseBlock(exerciseId, beforeDate, excludeSessionId) {
  const sessions = completedSessionsSorted().filter(s => s.id !== excludeSessionId && s.date < beforeDate);
  for (const s of sessions) {
    const block = s.exercises.find(e => e.exerciseId === exerciseId);
    if (block) return { session: s, block };
  }
  return null;
}
function hasSetData(set) {
  return !!set && (set.weight != null || set.reps != null || set.repsLeft != null || set.repsRight != null || set.weightLeft != null || set.weightRight != null);
}
/* a set someone started logging (has weight or reps) but didn't finish — missing weight, reps, or RPE on either side */
function setIsIncomplete(set, isUni) {
  if (!hasSetData(set)) return false;
  if (isUni) return set.weightLeft == null || set.weightRight == null || set.repsLeft == null || set.repsRight == null || set.intensityValueLeft == null || set.intensityValueRight == null;
  return set.weight == null || set.reps == null || set.intensityValue == null;
}
function sessionIncompleteSets(s) {
  const items = [];
  s.exercises.forEach(ex => {
    const isUni = ex.laterality === 'unilateral';
    ex.sets.forEach((set, setIdx) => {
      if (setIsIncomplete(set, isUni)) items.push({ exName: ex.nameSnapshot, label: `Set ${setIdx+1}` });
      (set.drops||[]).forEach((d, di) => { if (setIsIncomplete(d, isUni)) items.push({ exName: ex.nameSnapshot, label: `Set ${setIdx+1} · Drop ${di+1}` }); });
    });
  });
  return items;
}
function compareTopSet(prevSet, currSet) {
  if (!prevSet || !currSet || !hasSetData(currSet)) return null;
  const pr = repsOf(prevSet), cr = repsOf(currSet);
  const pw = weightOf(prevSet), cw = weightOf(currSet);
  if (pr == null || cr == null || cw == null || pw == null) return null;
  if (cw > pw && cr >= pr) return { type:'weight', text:`+${round1(cw-pw)}kg at ${cr>pr?'more':'the same'} reps` };
  if (cw === pw && cr > pr) return { type:'reps', text:`+${round1(cr-pr)} reps at the same weight` };
  if (cw === pw && cr === pr) {
    const pi = intensityNum(prevSet), ci = intensityNum(currSet);
    if (pi != null && ci != null && ci < pi) return { type:'intensity', text:'Same performance at a lower RPE' };
  }
  return null;
}
/* like compareTopSet, but reports every direction (up/flat/down) instead of only improvements —
   used where the trainer needs the honest picture, not just a highlight reel */
function compareTopSetFull(prevSet, currSet) {
  if (!prevSet || !currSet || !hasSetData(currSet)) return null;
  const pr = repsOf(prevSet), cr = repsOf(currSet);
  const pw = weightOf(prevSet), cw = weightOf(currSet);
  if (pr == null || cr == null || cw == null || pw == null) return null;
  const dw = round1(cw - pw), dr = round1(cr - pr);
  if (dw > 0 && dr >= 0) return { dir:'up', text:`+${dw}kg at ${dr>0?'more':'the same'} reps` };
  if (dw === 0 && dr > 0) return { dir:'up', text:`+${dr} reps at the same weight` };
  if (dw === 0 && dr === 0) {
    const pi = intensityNum(prevSet), ci = intensityNum(currSet);
    if (pi != null && ci != null && ci < pi) return { dir:'up', text:'Same weight & reps at a lower RPE' };
    if (pi != null && ci != null && ci > pi) return { dir:'down', text:'Same weight & reps at a higher RPE' };
    return { dir:'flat', text:'Matched last time — same weight & reps' };
  }
  if (dw < 0 && dr <= 0) return { dir:'down', text:`${dw}kg at ${dr<0?'fewer':'the same'} reps` };
  if (dw === 0 && dr < 0) return { dir:'down', text:`${dr} reps at the same weight` };
  return { dir:'flat', text:`${dw>0?'+':''}${dw}kg, ${dr>0?'+':''}${dr} reps vs last time` };
}
function isPR(exerciseId, set, beforeDate) {
  const w = weightOf(set);
  if (!set || !hasSetData(set) || w == null) return false;
  const r = repsOf(set);
  const past = state.workoutSessions.filter(s => s.date < beforeDate);
  let maxW = -1, repsAtMax = -1;
  for (const s of past) {
    const block = s.exercises.find(e => e.exerciseId === exerciseId);
    if (!block) continue;
    for (const st of [...block.sets, ...block.sets.flatMap(x=>x.drops||[])]) {
      if (!hasSetData(st)) continue;
      const stW = weightOf(st);
      if (stW == null) continue;
      const sr = repsOf(st);
      if (stW > maxW || (stW === maxW && sr > repsAtMax)) { maxW = stW; repsAtMax = sr; }
    }
  }
  if (maxW < 0) return false;
  return (w > maxW) || (w === maxW && r > repsAtMax);
}
function sessionStats(session) {
  let workingSets=0, dropSets=0, totalReps=0, volume=0, exercisesDone=0;
  for (const ex of session.exercises) {
    let any=false;
    const allSets = session_flatSets(ex);
    for (const {set,isDrop} of allSets) {
      if (!hasSetData(set)) continue;
      any = true;
      if (isDrop) dropSets++; else if (set.type==='working') workingSets++;
      const mult = ex.loadType === 'per_side' ? 2 : 1;
      if (set.weightLeft != null || set.weightRight != null || set.repsLeft != null || set.repsRight != null) {
        const rl = set.repsLeft || 0, rr = set.repsRight || 0;
        totalReps += rl + rr;
        volume += (set.weightLeft || 0) * mult * rl + (set.weightRight || 0) * mult * rr;
      } else {
        const r = set.reps || 0;
        totalReps += r;
        if (set.weight) volume += set.weight * mult * r;
      }
    }
    if (any) exercisesDone++;
  }
  return { workingSets, dropSets, totalReps, volume: Math.round(volume), exercisesDone, exercisesTotal: session.exercises.length };
}
function session_flatSets(ex) {
  const out = [];
  for (const s of ex.sets) { out.push({set:s, isDrop:false}); for (const d of (s.drops||[])) out.push({set:d, isDrop:true}); }
  return out;
}

function intensityLabel(set, side='') {
  if (!set) return '';
  const val = set['intensityValue'+side];
  if (val === 'failure' || val == null) return val==='failure' ? 'Failure' : '';
  if (set['intensityMethod'+side] === 'rir') return `RIR ${val}`;
  return `RPE ${val}`;
}
/* compact "RPE L8/R9" style label for a unilateral set's independently-tracked left/right intensity */
function intensityLabelSides(set) {
  const l = set.intensityValueLeft, r = set.intensityValueRight;
  if (l == null && r == null) return '';
  const method = set.intensityMethodLeft || set.intensityMethodRight || 'rpe';
  const fmt = (v) => v == null ? '–' : (v === 'failure' ? 'F' : v);
  return `${method === 'rir' ? 'RIR' : 'RPE'} L${fmt(l)}/R${fmt(r)}`;
}

function route() {
  const h = location.hash.replace(/^#/, '') || '/home';
  const parts = h.split('/').filter(Boolean);
  return { path: '/' + (parts[0]||'home'), parts };
}
function navigate(h) { location.hash = h; }
/* a draft sequence being actively edited, with at least one exercise — navigating away from
   this should be an intentional save-draft/discard choice, not a silent auto-save */
function draftNavGuardSequence() {
  const r = route();
  if (r.parts[0] !== 'sequences' || !r.parts[1]) return null;
  const seq = getSequence(r.parts[1]);
  if (!seq || !seq.draft || seq.exercises.length === 0) return null;
  return seq;
}
/* an empty draft (no exercises) has nothing worth saving — leaving it should quietly
   discard the shell instead of letting it sit around as a saved "empty sequence" */
function emptyDraftOnCurrentPage() {
  const r = route();
  if (r.parts[0] !== 'sequences' || !r.parts[1]) return null;
  const seq = getSequence(r.parts[1]);
  if (!seq || !seq.draft || seq.exercises.length > 0) return null;
  return seq;
}

function renderInner() {
  applyTheme();
  if (!state.authUser) { $('#root').innerHTML = renderSignInScreen(); return; }
  if (state.booting) { $('#root').innerHTML = renderLoadingScreen(); return; }
  if (state.notAuthorized) { $('#root').innerHTML = renderNotAuthorizedScreen(); return; }
  const { path, parts } = route();
  if (!state.viewingTraineeUid && path !== '/admin') { $('#root').innerHTML = renderNoRoleScreen(); return; }

  let body = '';
  let navKey = 'home';
  if (path === '/home') { body = renderHome(); navKey='home'; }
  else if (path === '/calendar') { body = renderCalendar(); navKey='calendar'; }
  else if (path === '/sequences') {
    if (parts[1]) { body = renderSequenceDetail(parts[1]); } else { body = renderSequencesList(); }
    navKey='sequences';
  }
  else if (path === '/library') { body = renderLibrary(); navKey='sequences'; }
  else if (path === '/history') {
    if (parts[1] === 'session' && parts[2]) body = renderSessionDetail(parts[2], false);
    else if (parts[1] === 'exercise' && parts[2]) body = renderExerciseHistory(parts[2]);
    else body = renderHistory();

  else if (path === '/workout') { body = renderActiveWorkout(); navKey='workout'; }
  else if (path === '/summary') { body = renderSessionDetail(parts[1], true); navKey='workout'; }
  else if (path === '/admin') {
    body = renderAdminCenter(); navKey='admin';

  else { body = renderHome(); }

  const screenTitle = {home:'Home',calendar:'Calendar',sequences:'Sequences',history:'History',workout:'Workout',admin:'Admin Center'}[navKey] || 'Home';

function miniDatePicker(m) {
  const y = m.pickerYear, mo = m.pickerMonth;
  const first = new Date(y, mo, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const prevDaysInMonth = new Date(y, mo, 0).getDate();
  const cells = [];
  for (let i=startOffset-1;i>=0;i--) cells.push({d: prevDaysInMonth-i, cur:false});
  for (let d=1; d<=daysInMonth; d++) cells.push({d, cur:true});
  while (cells.length % 7 !== 0) cells.push({d: cells.length - (startOffset+daysInMonth) + 1, cur:false});
  function cellDateStr(cell) {
    const mm = cell.cur ? mo : (cell.d > 15 ? mo-1 : mo+1);
    return iso(new Date(y, mm, cell.d));
  }
  const grid = cells.map(cell => {
    const dstr = cellDateStr(cell);
    const isToday = dstr === todayISO();
    const isSelected = dstr === m.date;
    let cls = 'text-on-surface hover:bg-surface-container';
    if (!cell.cur) cls = 'text-outline-variant';
    if (isSelected) cls = 'bg-primary text-on-primary shadow-md';
    else if (isToday) cls = 'bg-surface-container-low text-on-surface font-bold';
    return `<button data-action="picker-select-day" data-date="${dstr}" class="h-9 w-9 mx-auto flex items-center justify-center rounded-full font-label-md text-label-md transition-all ${cls}" type="button">${cell.d}</button>`;
  }).join('');
  return `
  <div class="bg-surface-container-low rounded-xl p-3">
    <div class="flex items-center justify-between mb-2 px-1">

  const next = upcomingScheduled()[0];

  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  let prCard = '';

      const top = topWorkingSet(ex);
      if (!top) continue;
      const prev = findPreviousExerciseBlock(ex.exerciseId, recent.date, recent.id);
      const cmp = prev ? compareTopSet(topWorkingSet(prev.block), top) : null;
      if (cmp) {
        prCard = `

          <div class="flex items-center justify-between">

/* ================= CALENDAR ================= */
function schedulesOnDate(d) { return state.scheduledSessions.filter(s => s.date === d); }

function renderCalendar() {
  const { calYear, calMonth, calView, calSelectedDate } = state.ui;
  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-start
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevDaysInMonth = new Date(calYear, calMonth, 0).getDate();
  const cells = [];
  for (let i=startOffset-1;i>=0;i--) cells.push({d: prevDaysInMonth-i, cur:false});
  for (let d=1; d<=daysInMonth; d++) cells.push({d, cur:true});
  while (cells.length % 7 !== 0) cells.push({d: cells.length - (startOffset+daysInMonth) + 1, cur:false});

  const monthLabel = `${MONTHS[calMonth].slice(0,3)} ${calYear}`;
  const completedCount = state.scheduledSessions.filter(s=>s.status==='completed' && new Date(s.date+'T00:00:00').getMonth()===calMonth && new Date(s.date+'T00:00:00').getFullYear()===calYear).length;
  const plannedCount = state.scheduledSessions.filter(s=>s.status==='planned' && new Date(s.date+'T00:00:00').getMonth()===calMonth && new Date(s.date+'T00:00:00').getFullYear()===calYear).length;

  function cellDateStr(cell) {
    const m = cell.cur ? calMonth : (cell.d > 15 ? calMonth-1 : calMonth+1);
    const dt = new Date(calYear, m, cell.d);
    return iso(dt);
  }

  const grid = cells.map(cell => {
    const dstr = cellDateStr(cell);
    const scheds = cell.cur ? schedulesOnDate(dstr) : [];
    const isToday = dstr === todayISO();
    const isSelected = dstr === calSelectedDate;
    let cls = 'text-on-surface hover:bg-surface-container';
    if (!cell.cur) cls = 'text-outline-variant';
    if (isSelected) cls = 'bg-primary text-on-primary shadow-md scale-105';
    else if (isToday) cls = 'bg-surface-container-low text-on-surface font-bold';
    const dot = scheds.length ? `<span class="absolute bottom-1 w-1.5 h-1.5 rounded-full ${scheds.some(s=>s.status==='completed')?'bg-primary':'bg-secondary'} ${isSelected?'!bg-on-primary':''}"></span>` : '';
    return `<button data-action="cal-select-day" data-date="${dstr}" class="h-10 w-10 mx-auto flex flex-col items-center justify-center rounded-full font-label-md text-label-md relative transition-all ${cls}" type="button"><span>${cell.d}</span>${dot}</button>`;
  }).join('');

  const selectedList = schedulesOnDate(calSelectedDate);

  return `
  <div class="flex flex-col gap-space-sm pt-2 mb-space-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-space-xs">
        <h2 class="font-headline-md text-headline-md text-on-surface">${monthLabel}</h2>
        <div class="flex items-center">
          <button data-action="cal-prev-month" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant" type="button">${icon('chevron_left','text-[20px]')}</button>
          <button data-action="cal-next-month" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant" type="button">${icon('chevron_right','text-[20px]')}</button>
        </div>
      </div>
      <div class="bg-surface-container p-1 rounded-full flex items-center shadow-sm">
        <button data-action="cal-view" data-view="month" class="px-3 py-1.5 rounded-full font-label-sm text-label-sm flex items-center gap-1 ${calView==='month'?'bg-surface-container-lowest text-on-surface shadow-sm':'text-on-surface-variant'}" type="button">${icon('calendar_month','text-[16px]')}Month</button>
        <button data-action="cal-view" data-view="list" class="px-3 py-1.5 rounded-full font-label-sm text-label-sm flex items-center gap-1 ${calView==='list'?'bg-surface-container-lowest text-on-surface shadow-sm':'text-on-surface-variant'}" type="button">${icon('format_list_bulleted','text-[16px]')}List</button>
      </div>
    </div>
  </div>

  ${calView==='month' ? `
  <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm">
    <div class="grid grid-cols-7 mb-2 text-center">${DOW.map(d=>`<span class="font-label-sm text-label-sm text-outline">${d[0]}</span>`).join('')}</div>
    <div class="grid grid-cols-7 gap-y-1.5 gap-x-1 text-center items-center">${grid}</div>
    <div class="flex items-center justify-center gap-6 mt-4 pt-3 bg-surface-container-low/50 rounded-xl px-2 py-2">
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-primary"></span><span class="font-label-sm text-label-sm text-on-surface-variant">Completed (${completedCount})</span></div>
      <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-secondary"></span><span class="font-label-sm text-label-sm text-on-surface-variant">Scheduled (${plannedCount})</span></div>
    </div>
  </div>

  <div class="flex items-center justify-between gap-space-sm mt-space-md">
    <button data-action="open-schedule-modal" class="flex-1 h-12 rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm" type="button">${icon('add_circle','text-[20px]')}Schedule Workout</button>
  </div>

  <div class="mt-space-md bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-space-sm">
    <div class="flex items-center justify-between">
      <h3 class="font-title-md text-title-md text-on-surface">${fmtFull(calSelectedDate)}</h3>
      ${calSelectedDate===todayISO() ? pill('Today', 'bg-primary-fixed text-on-primary-fixed') : ''}
    </div>
    ${selectedList.length === 0 ? `<p class="font-body-md text-body-md text-on-surface-variant">Nothing scheduled. Tap "Schedule Workout" to plan one.</p>` :
      selectedList.map(s => dayDetailCard(s)).join('')}
  </div>
  ` : `
  <div class="flex flex-col gap-space-sm">
    ${state.scheduledSessions.filter(s=>s.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)).map(s => listFeedCard(s)).join('') || `<p class="font-body-md text-body-md text-on-surface-variant">No upcoming sessions.</p>`}
  </div>
  `}
  `;
}

function sequenceExerciseListRows(exercises) {
  return exercises.map((sx, i) => {
    const ex = getExercise(sx.exerciseId); const p = sx.prescription;
    if (!ex) return '';
    return `
    <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-surface-container-low">
      <span class="w-5 h-5 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-sm text-label-sm font-bold flex-shrink-0">${i+1}</span>
      <span class="font-label-md text-label-md text-on-surface truncate flex-1 min-w-0">${esc(ex.name)}</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant flex-shrink-0 text-right">${p.sets} × ${p.repLow}-${p.repHigh} reps${p.drops.length?`<span class="block text-tertiary">+${p.drops.length} drop${p.drops.length>1?'s':''}</span>`:''}</span>
    </div>`;
  }).join('');
}
function dayDetailCard(s) {
  const seq = getSequence(s.sequenceId);
  const statusPill = s.status==='completed' ? pill('Completed','bg-primary-fixed text-on-primary-fixed-variant') :
    s.status==='skipped' ? pill('Skipped','bg-error-container text-on-error-container') : pill('Planned','bg-surface-container text-on-surface-variant');
  return `
  <div class="flex flex-col gap-2 border-t border-outline-variant/30 pt-3 mt-1 first:border-t-0 first:pt-0 first:mt-0">
    <div class="flex items-center justify-between gap-2">
      <h4 class="font-headline-md text-headline-md text-on-surface min-w-0 truncate">${esc(seq.name)}</h4>

        ${s.status==='planned' ? `<button data-action="open-cancel-scheduled" data-id="${s.id}" aria-label="Cancel scheduled session" class="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-error hover:bg-error-container transition-colors" type="button">${icon('close','text-[18px]')}</button>` : ''}

    <div class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md flex-wrap">

      <span>•</span>
      <span class="flex items-center gap-1">${icon('schedule','text-[16px]')}~${Math.round(seq.exercises.reduce((a,e)=>a+e.prescription.restSeconds,0)/60)+seq.exercises.length*4}m</span>
    </div>
    <div class="flex flex-col gap-1 mt-1">

    ${s.status==='planned' ? `

      <button data-action="start-workout" data-sequence-id="${seq.id}" data-scheduled-id="${s.id}" class="w-full h-12 rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2" type="button">${icon('play_arrow','text-[20px]')}Start This Workout</button>
      <div class="grid grid-cols-2 gap-2">

      </div>
    </div>` : s.linkedWorkoutSessionId ? `
      <button data-action="go" data-href="#/history/session/${s.linkedWorkoutSessionId}" class="w-full h-11 rounded-full bg-surface-container text-on-surface font-label-md text-label-md mt-1" type="button">View logged session</button>
    ` : ''}
  </div>`;
}

    </div>

/* ================= SEQUENCES ================= */
function renderSequencesList() {
  const drafts = state.sequences.filter(s=>s.draft);
  const active = state.sequences.filter(s=>!s.archived && !s.draft);
  const archived = state.sequences.filter(s=>s.archived && !s.draft);
  const isTrainer = true; // sequence & library editing is open to both roles in this prototype
  return `
  <div class="flex items-center justify-between pt-2 mb-space-md">
    <h2 class="font-headline-lg text-headline-lg text-on-surface">Sequences</h2>
    <div class="flex items-center gap-2">
      <a href="#/library" class="h-10 px-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md flex items-center gap-1.5">${icon('menu_book','text-[18px]')}Library</a>
      ${isTrainer ? `<button data-action="new-sequence" class="h-10 w-10 rounded-full bg-primary text-on-primary flex items-center justify-center" type="button">${icon('add','text-[20px]')}</button>` : ''}
    </div>
  </div>
  ${drafts.length ? `
  <div class="mb-space-lg">
    <h3 class="font-label-sm text-label-sm uppercase tracking-wider text-tertiary px-1 mb-2">Drafts</h3>
    <div class="flex flex-col gap-space-sm">${drafts.map(s => sequenceCard(s, isTrainer)).join('')}</div>
  </div>` : ''}
  <div class="flex flex-col gap-space-sm">
    ${active.map(s => sequenceCard(s, isTrainer)).join('')}
  </div>
  ${archived.length ? `
  <div class="mt-space-lg">
    <h3 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant px-1 mb-2">Archived</h3>
    <div class="flex flex-col gap-space-sm opacity-70">${archived.map(s => sequenceCard(s, isTrainer)).join('')}</div>
  </div>` : ''}
  `;
}

function sequenceCard(s, isTrainer) {
  const lastUsed = state.scheduledSessions.filter(sc=>sc.sequenceId===s.id && sc.status==='completed').sort((a,b)=>b.date.localeCompare(a.date))[0];
  const isDraft = !!s.draft;
  const isRenaming = isTrainer && state.ui.inlineRenameSeqId === s.id;
  return `
  <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-2 ${isDraft ? 'border border-tertiary-fixed-dim/60' : ''}">
    <div class="flex items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        ${isRenaming ? `
        <div class="flex items-center gap-1.5">
          <input id="f-inline-rename-${s.id}" value="${esc(state.ui.inlineRenameDraft ?? s.name)}" autofocus onkeydown="if(event.key==='Enter'){actions['confirm-inline-rename']({id:'${s.id}'})}else if(event.key==='Escape'){actions['cancel-inline-rename']({})}" class="flex-1 min-w-0 h-10 px-2.5 rounded-lg bg-surface-container-low border ${state.ui.inlineRenameError?'border-error':'border-primary'} text-on-surface font-title-md text-title-md font-semibold">
          <button data-action="confirm-inline-rename" data-id="${s.id}" aria-label="Save name" class="w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center flex-shrink-0" type="button">${icon('check','text-[18px]')}</button>
          <button data-action="cancel-inline-rename" aria-label="Cancel rename" class="w-9 h-9 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center flex-shrink-0" type="button">${icon('close','text-[18px]')}</button>
        </div>
        ${state.ui.inlineRenameError ? `<p class="font-label-sm text-label-sm text-error mt-1 flex items-center gap-1">${icon('error','text-[14px]')}${esc(state.ui.inlineRenameError)}</p>` : ''}` : `

/* most recent completed session's logged drop-set numbers for an exercise, if any */
function lastLoggedDropsFor(exerciseId) {
  for (const s of completedSessionsSorted()) {
    const block = s.exercises.find(e => e.exerciseId === exerciseId);
    if (!block) continue;
    const setWithDrops = block.sets.find(set => (set.drops||[]).some(d => hasSetData(d)));
    if (setWithDrops) return setWithDrops.drops.filter(d => hasSetData(d));
  }
  return null;
}
function dropSummary(d, ex) {
  const unit = ex.loadType === 'per_side' ? 'kg/side' : 'kg';
  if (ex.laterality === 'unilateral') return `L${d.weightLeft ?? '–'}/R${d.weightRight ?? '–'}${unit} × L${d.repsLeft ?? '–'}/R${d.repsRight ?? '–'}`;
  return `${d.weight ?? '–'}${unit} × ${d.reps ?? '–'}`;
}

/* ================= ACTIVE WORKOUT ================= */
/* builds a live session exercise block for exerciseId — if this exercise has a previously completed
   session, follows its actual set/drop structure; otherwise falls back to the given prescription
   (sequence template default, or a bare 1-set/0-drop prescription when added/swapped in mid-session) */
function buildSessionExercise(exerciseId, prescription) {
  const ex = getExercise(exerciseId);
  const p = prescription || { sets: 1, drops: [], intensityMethod: 'rpe', notes: '', restSeconds: null, repLow: null, repHigh: null, intensityTarget: null };
  const prev = findPreviousExerciseBlock(exerciseId, todayISO(), null);
  const prevSets = prev ? prev.block.sets : null;
  const setCount = prevSets ? prevSets.length : p.sets;
  const sets = [];
  for (let i=0;i<setCount;i++) {
    const set = { id: uid('set'), type:'working', weight:null, weightLeft:null, weightRight:null, reps:null, repsLeft:null, repsRight:null, intensityMethod: p.intensityMethod, intensityValue:null, intensityMethodLeft: p.intensityMethod, intensityValueLeft:null, intensityMethodRight: p.intensityMethod, intensityValueRight:null, note:'', completed:false, drops:[] };
    const dropCount = prevSets ? (prevSets[i] ? prevSets[i].drops.length : 0) : (i === setCount-1 ? p.drops.length : 0);
    if (dropCount) {
      set.drops = Array.from({length: dropCount}, () => ({ id: uid('set'), type:'drop', weight:null, weightLeft:null, weightRight:null, reps:null, repsLeft:null, repsRight:null, intensityMethod: p.intensityMethod, intensityValue:null, intensityMethodLeft: p.intensityMethod, intensityValueLeft:null, intensityMethodRight: p.intensityMethod, intensityValueRight:null, note:'', completed:false }));
    }
    sets.push(set);
  }
  return { exerciseId: ex.id, nameSnapshot: ex.name, category: ex.category, laterality: ex.laterality, loadType: ex.loadType,
    trainerNote: p.notes || ex.notes || '', exerciseNote: prev ? (prev.block.exerciseNote || '') : '',
    restSeconds: p.restSeconds, targetRepLow: p.repLow, targetRepHigh: p.repHigh,
    targetIntensity: p.intensityTarget, sets };
}
function beginWorkout(sequenceId, scheduledId) {
  const seq = getSequence(sequenceId);
  const exercises = seq.exercises.map(sx => buildSessionExercise(sx.exerciseId, sx.prescription));
  state.activeSession = { id: uid('ws'), sequenceId: seq.id, sequenceName: seq.name, scheduledSessionId: scheduledId,
    date: todayISO(), startedAt: Date.now(), performedBy: state.role, exercises };
  saveState(); navigate('#/workout');
}
/* true when the live session's exercises (swapped/added mid-session) no longer match the sequence it started from */
function sessionCustomized(s) {
  const seq = getSequence(s.sequenceId);
  if (!seq) return false;
  const a = seq.exercises.map(sx => sx.exerciseId), b = s.exercises.map(e => e.exerciseId);
  return a.length !== b.length || a.some((id, i) => id !== b[i]);
}
/* turns a live session exercise block into a sequence prescription, so "update the sequence" can persist what was actually done */
function sequenceExerciseFromSessionBlock(e) {
  const last = e.sets[e.sets.length - 1];
  return { id: uid('sqx'), exerciseId: e.exerciseId, prescription: {
    sets: e.sets.length, repLow: e.targetRepLow ?? 8, repHigh: e.targetRepHigh ?? 12,
    targetWeight: null, intensityMethod: 'rpe', intensityTarget: e.targetIntensity ?? 8,
    restSeconds: e.restSeconds ?? 75, notes: e.trainerNote || '',
    drops: last ? (last.drops||[]).map(() => ({weight:null, reps:null})) : []
  }};
}
function finalizeActiveSession() {
  const s = state.activeSession;
  const finished = {
    id: s.id, sequenceId: s.sequenceId, sequenceName: s.sequenceName, scheduledSessionId: s.scheduledSessionId,
    date: s.date, durationSeconds: Math.floor((Date.now() - s.startedAt) / 1000), performedBy: s.performedBy,
    reviewedByTrainer: s.performedBy === 'trainer', trainerNote: null, clientNoteForTrainer: '',

  state.workoutSessions.push(finished);

  state.activeSession = null; state.ui.modal = null; saveState();
  navigate('#/summary/' + finished.id);
}

      <button data-action="add-drop" data-ex-idx="${exIdx}" class="flex-1 min-h-[44px] px-4 bg-tertiary-fixed text-on-tertiary-fixed font-label-lg text-label-lg rounded-full flex items-center justify-center gap-1.5" type="button">${icon('alt_route','text-[20px] text-tertiary')}Add Drop Set</button>
    </div>
  </section>`;
}

function prevSetRows(block) {
  let workingIdx = 0;
  return session_flatSets(block).map(({ set, isDrop }) => {
    if (!isDrop) workingIdx++;
    const label = isDrop ? '↳ Drop' : `Set ${workingIdx}`;
    const unit = block.loadType === 'per_side' ? 'kg/side' : 'kg';
    const isUni = block.laterality === 'unilateral';
    const intensity = isUni ? intensityLabelSides(set) : intensityLabel(set);
    const isFail = isUni ? (set.intensityValueLeft==='failure'||set.intensityValueRight==='failure') : set.intensityValue==='failure';
    if (isUni) {
      const side = (w, r) => `${w != null ? `${w}${unit}` : '–'} × ${r ?? '–'}`;
      return `
      <div class="flex items-start justify-between gap-2 py-1.5 ${isDrop ? 'pl-3' : ''}">
        <span class="font-label-sm text-label-sm ${isDrop ? 'text-on-surface-variant' : 'text-on-surface font-bold'} flex-shrink-0 pt-0.5">${label}</span>
        <div class="flex-1 min-w-0 text-right px-2">
          <div class="font-body-md text-body-md text-on-surface truncate"><span class="font-label-sm text-label-sm text-on-surface-variant mr-1">L</span>${side(set.weightLeft, set.repsLeft)}</div>
          <div class="font-body-md text-body-md text-on-surface truncate"><span class="font-label-sm text-label-sm text-on-surface-variant mr-1">R</span>${side(set.weightRight, set.repsRight)}</div>
        </div>
        ${intensity ? `<span class="font-label-sm text-label-sm font-bold ${isFail?'text-tertiary':'text-on-surface-variant'} flex-shrink-0 pt-0.5">${intensity}</span>` : ''}
      </div>`;
    }
    return `
    <div class="flex items-center justify-between gap-2 py-1.5 ${isDrop ? 'pl-3' : ''}">
      <span class="font-label-sm text-label-sm ${isDrop ? 'text-on-surface-variant' : 'text-on-surface font-bold'} flex-shrink-0">${label}</span>
      <span class="font-body-md text-body-md text-on-surface flex-1 text-right truncate px-2">${set.weight != null ? `${set.weight}${unit}` : '–'} × ${set.reps ?? '–'}</span>
      ${intensity ? `<span class="font-label-sm text-label-sm font-bold ${isFail?'text-tertiary':'text-on-surface-variant'} flex-shrink-0">${intensity}</span>` : ''}
    </div>`;
  }).join('');
}

function stepperField(path, value, unit, step, min) {
  return `
  <div class="flex items-stretch bg-surface-container-lowest rounded-lg shadow-sm overflow-hidden">
    <button data-action="adj" data-path="${path}" data-delta="${-step}" data-min="${min}" class="w-8 min-h-[44px] flex items-center justify-center text-on-surface-variant active:bg-surface-container flex-shrink-0" type="button">${icon('remove','text-[16px]')}</button>
    <div class="flex-1 flex flex-col items-center justify-center py-1 px-0.5 min-w-0">
      <input data-bind="${path}" data-type="number" type="text" inputmode="decimal" value="${value==null?'':value}" class="w-full min-w-0 bg-transparent outline-none text-center font-numeric-metric text-numeric-metric font-extrabold text-on-surface leading-tight">
      <span class="font-label-sm text-label-sm text-on-surface-variant font-medium leading-none mt-0.5">${unit}</span>
    </div>
    <button data-action="adj" data-path="${path}" data-delta="${step}" data-min="${min}" class="w-8 min-h-[44px] flex items-center justify-center text-on-surface-variant active:bg-surface-container flex-shrink-0" type="button">${icon('add','text-[16px]')}</button>
  </div>`;
}

function intensityPillGroup(basePath, obj, opts={}) {
  const side = opts.side || '';
  const compact = !!opts.compact;
  const methodKey = 'intensityMethod' + side, valueKey = 'intensityValue' + side;
  const method = obj[methodKey] || 'rpe';
  const values = method === 'rir' ? [3,2,1,0] : [7,8,9,10];
  const wrapCls = compact ? 'mt-2 p-1.5' : 'mt-2.5 p-2';
  const pillCls = compact ? 'min-h-[32px] px-2 py-0.5 font-label-sm text-label-sm' : 'min-h-[36px] px-3 py-1 font-label-md text-label-md';
  return `
  <div class="${wrapCls} bg-surface-container-lowest/80 rounded-lg flex items-center gap-1 overflow-x-auto no-scrollbar">
    <button data-action="set-intensity-method" data-base-path="${basePath}" data-key="${methodKey}" data-value-key="${valueKey}" data-method="${method==='rpe'?'rir':'rpe'}" class="font-label-sm text-label-sm text-on-surface-variant font-bold pr-1 flex-shrink-0 underline decoration-dotted" type="button">${method.toUpperCase()}:</button>
    <div class="flex items-center gap-1.5 flex-1 justify-end flex-wrap">
      ${values.map(v => `<button data-action="set-intensity-value" data-base-path="${basePath}" data-key="${valueKey}" data-method-key="${methodKey}" data-method="${method}" data-value="${v}" class="${pillCls} rounded-full font-semibold flex-shrink-0 ${obj[valueKey]===v?'bg-primary text-on-primary font-bold shadow-sm':'bg-surface-container text-on-surface'}" type="button">${v}</button>`).join('')}
      <button data-action="set-intensity-value" data-base-path="${basePath}" data-key="${valueKey}" data-method-key="${methodKey}" data-method="failure" data-value="failure" class="${pillCls} rounded-full font-bold flex-shrink-0 ${obj[valueKey]==='failure'?'bg-tertiary text-on-tertiary':'bg-surface-container text-tertiary'}" type="button">FAIL</button>
    </div>
  </div>`;
}

function renderEditableWorkingSet(exIdx, setIdx, set, ex) {
  const base = `activeSession.exercises.${exIdx}.sets.${setIdx}`;
  const label = set.type === 'warmup' ? 'WARM' : 'WORK';
  const bg = hasSetData(set) ? 'bg-primary-fixed/20' : 'bg-surface-container-low';
  const unit = ex.loadType === 'per_side' ? 'kg/side' : 'kg';
  const body = ex.laterality === 'unilateral' ? `
    <div class="${bg} rounded-xl p-3 mb-3 transition-all">
      <button data-action="set-cycle-type" data-ex-idx="${exIdx}" data-set-idx="${setIdx}" class="flex items-center gap-2 mb-2" type="button">
        <span class="w-7 h-7 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-title-md text-title-md font-bold">${setIdx+1}</span>
        <span class="font-label-md text-label-md font-bold text-on-surface">${label} Set</span>
      </button>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-surface-container-lowest rounded-xl p-2.5 shadow-sm flex flex-col gap-1.5">
          <span class="px-2 py-0.5 bg-surface-container text-on-surface font-label-sm text-label-sm rounded-full font-bold self-start">LEFT</span>
          ${stepperField(`${base}.weightLeft`, set.weightLeft, unit, 1, 0)}
          ${stepperField(`${base}.repsLeft`, set.repsLeft, 'reps', 1, 0)}
          ${intensityPillGroup(base, set, {side:'Left', compact:true})}
        </div>
        <div class="bg-surface-container-lowest rounded-xl p-2.5 shadow-sm flex flex-col gap-1.5">
          <span class="px-2 py-0.5 bg-surface-container text-on-surface font-label-sm text-label-sm rounded-full font-bold self-start">RIGHT</span>
          ${stepperField(`${base}.weightRight`, set.weightRight, unit, 1, 0)}
          ${stepperField(`${base}.repsRight`, set.repsRight, 'reps', 1, 0)}
          ${intensityPillGroup(base, set, {side:'Right', compact:true})}
        </div>
      </div>
    </div>` : `
    <div class="${bg} rounded-xl p-2.5 mb-2.5 transition-all">
      <div class="flex items-center gap-2">
        <button data-action="set-cycle-type" data-ex-idx="${exIdx}" data-set-idx="${setIdx}" class="w-10 flex-shrink-0 flex flex-col items-center justify-center" type="button">
          <span class="w-8 h-8 rounded-full bg-surface-container text-on-surface flex items-center justify-center font-title-md text-title-md font-bold">${setIdx+1}</span>
          <span class="font-label-sm text-[10px] text-on-surface-variant font-semibold mt-0.5">${label}</span>
        </button>
        <div class="flex-1 min-w-0">${stepperField(`${base}.weight`, set.weight, unit, ex.loadType==='per_side'?1:2.5, 0)}</div>
        <div class="flex-1 min-w-0">${stepperField(`${base}.reps`, set.reps, 'reps', 1, 0)}</div>
      </div>
      ${intensityPillGroup(base, set)}
      <div class="mt-2 flex items-center justify-end">
        <button data-action="remove-set" data-ex-idx="${exIdx}" data-set-idx="${setIdx}" aria-label="Remove set" class="h-9 px-3 rounded-full flex items-center gap-1 text-on-surface-variant hover:bg-surface-container-lowest flex-shrink-0" type="button">${icon('close','text-[16px]')}<span class="font-label-sm text-label-sm">Remove set</span></button>
      </div>
    </div>`;
  const drops = (set.drops||[]).length ? `
    <div class="relative pl-6 ml-4 my-2 flex flex-col gap-2">
      <div class="absolute left-1 top-0 bottom-4 w-1 bg-tertiary-fixed rounded-full"></div>
      ${set.drops.map((d, di) => renderEditableDrop(exIdx, setIdx, di, d, ex)).join('')}
    </div>` : '';
  return body + drops;
}

function renderEditableDrop(exIdx, setIdx, dropIdx, drop, ex) {
  const base = `activeSession.exercises.${exIdx}.sets.${setIdx}.drops.${dropIdx}`;
  const unit = ex.loadType === 'per_side' ? 'kg/side' : 'kg';
  const isUni = ex.laterality === 'unilateral';
  return `
  <div class="relative bg-surface-container-high/60 rounded-xl p-2.5">
    <span class="absolute -left-5 top-4 font-bold text-tertiary text-[18px]">↳</span>
    <div class="flex items-center justify-between mb-1.5">
      <span class="px-2 py-0.5 bg-tertiary text-on-tertiary font-label-sm text-label-sm rounded-full font-extrabold uppercase">DROP ${dropIdx+1}</span>
      <button data-action="remove-drop" data-ex-idx="${exIdx}" data-set-idx="${setIdx}" data-drop-idx="${dropIdx}" class="w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant" type="button">${icon('close','text-[14px]')}</button>
    </div>
    ${isUni ? `
    <div class="grid grid-cols-2 gap-2">
      <div class="flex flex-col gap-1.5">
        <span class="font-label-sm text-label-sm text-on-surface-variant font-bold">LEFT</span>
        ${stepperField(`${base}.weightLeft`, drop.weightLeft, unit, 1, 0)}
        ${stepperField(`${base}.repsLeft`, drop.repsLeft, 'reps', 1, 0)}
        ${intensityPillGroup(base, drop, {side:'Left', compact:true})}
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="font-label-sm text-label-sm text-on-surface-variant font-bold">RIGHT</span>
        ${stepperField(`${base}.weightRight`, drop.weightRight, unit, 1, 0)}
        ${stepperField(`${base}.repsRight`, drop.repsRight, 'reps', 1, 0)}
        ${intensityPillGroup(base, drop, {side:'Right', compact:true})}
      </div>
    </div>` : `
    <div class="flex items-center gap-2">
      <div class="flex-1 min-w-0">${stepperField(`${base}.weight`, drop.weight, unit, ex.loadType==='per_side'?1:2.5, 0)}</div>
      <div class="flex-1 min-w-0">${stepperField(`${base}.reps`, drop.reps, 'reps', 1, 0)}</div>
    </div>
    ${intensityPillGroup(base, drop)}`}
  </div>`;
}

/* ================= SESSION DETAIL / SUMMARY (read-only) ================= */
/* ---- shared glanceable table (Workout | Weight | Reps | Notes) for history/summary review ---- */
function tableHeaderRow() {
  return `<div class="grid grid-cols-[2fr_0.9fr_0.9fr_0.9fr] gap-3 px-3 py-2 bg-surface-container-low font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">
    <div>Workout</div><div class="text-right">Weight</div><div class="text-right">Reps</div><div class="text-right">RPE</div>
  </div>`;
}
function intensityBadgeHtml(set, isUni) {
  const label = isUni ? intensityLabelSides(set) : intensityLabel(set);
  if (!label) return '';
  const isFail = isUni ? (set.intensityValueLeft==='failure'||set.intensityValueRight==='failure') : set.intensityValue === 'failure';
  return `<span class="font-bold ${isFail ? 'text-tertiary' : 'text-on-surface'}">${label}</span>`;
}
function tableDataRow({ label, labelSub, badge, weight, weightUnit, reps, noteBadge, dim, href }) {
  const Tag = href ? 'a' : 'div';
  return `<${Tag} ${href ? `href="${href}"` : ''} class="grid grid-cols-[2fr_0.9fr_0.9fr_0.9fr] gap-3 px-3 py-2.5 border-t border-outline-variant/20 items-start ${dim ? 'opacity-70' : ''} ${href ? 'hover:bg-surface-container-low/60 transition-colors' : ''}">
    <div class="min-w-0">
      <div class="flex items-center gap-1 flex-wrap">
        <span class="font-label-md text-label-md text-on-surface">${label}</span>
        ${badge || ''}
      </div>
      ${labelSub ? `<span class="block font-label-sm text-label-sm text-on-surface-variant">${labelSub}</span>` : ''}
    </div>
    <div class="font-numeric-metric text-numeric-metric text-on-surface whitespace-nowrap text-right">${weight != null ? weight : '–'}${(weight != null && weightUnit) ? `<span class="text-label-sm font-body-md text-on-surface-variant ml-0.5">${weightUnit}</span>` : ''}</div>
    <div class="min-w-0 text-right"><span class="font-body-md text-body-md text-on-surface">${reps}</span></div>
    <div class="font-label-sm text-label-sm text-on-surface-variant min-w-0 text-right">${noteBadge || '–'}</div>
  </${Tag}>`;
}
function tableGroupHeader(name, badge) {
  return `<div class="px-3 py-2 border-t border-outline-variant/20 bg-surface-container-low/50 flex items-center gap-1.5">
    <span class="font-label-lg text-label-lg text-on-surface font-bold">${name}</span>
    ${badge || ''}
  </div>`;
}
function tableWrap(rowsHtml) {
  return `<div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <div class="min-w-[420px]">
        ${tableHeaderRow()}
        ${rowsHtml}
      </div>
    </div>
  </div>`;
}
function renderSessionTable(session) {
  const groups = [];
  for (const ex of session.exercises) {
    const flat = session_flatSets(ex).filter(x => hasSetData(x.set));
    if (!flat.length) continue;
    const pr = isPR(ex.exerciseId, topWorkingSet(ex), session.date);
    const unit = ex.loadType === 'per_side' ? 'kg/side' : 'kg';
    let workingIdx = 0;
    const isUni = ex.laterality === 'unilateral';
    const rows = flat.map(({ set, isDrop }) => {
      if (!isDrop) workingIdx++;
      const reps = isUni ? `L${set.repsLeft ?? '–'}/R${set.repsRight ?? '–'}` : `${set.reps ?? '–'}`;
      return tableDataRow({
        label: isDrop ? '↳ Drop' : `Set ${workingIdx}`,
        labelSub: (!isDrop && set.type === 'warmup') ? 'Warm-up' : null,
        weight: isUni ? `L${set.weightLeft ?? '–'}/R${set.weightRight ?? '–'}` : set.weight,
        weightUnit: isUni ? null : unit, reps, noteBadge: intensityBadgeHtml(set, isUni), dim: isDrop,
      });
    }).join('');
    groups.push(tableGroupHeader(esc(ex.nameSnapshot), pr ? pill('PR', 'bg-tertiary-fixed text-on-tertiary-fixed-variant font-bold') : '') + rows);
  }
  if (!groups.length) return `<p class="font-body-md text-body-md text-on-surface-variant">No sets were logged for this session.</p>`;
  return tableWrap(groups.join(''));
}

function renderSessionDetail(sessionId, isSummary) {
  const s = state.workoutSessions.find(w => w.id === sessionId);
  if (!s) return `<p class="text-on-surface-variant pt-8">Session not found.</p>`;
  const stats = sessionStats(s);
  const comparisons = [];
  for (const ex of s.exercises) {
    const top = topWorkingSet(ex);
    const prev = findPreviousExerciseBlock(ex.exerciseId, s.date, s.id);
    const cmp = prev ? compareTopSetFull(topWorkingSet(prev.block), top) : null;
    if (cmp) comparisons.push({ name: ex.nameSnapshot, ...cmp });
  }
  const backHref = isSummary ? '#/home' : '#/history';
  return `
  <div class="flex items-center gap-2 pt-2 mb-space-md">
    <a href="${backHref}" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-surface-container text-on-surface">${icon('arrow_back','text-[20px]')}</a>
    <h2 class="font-headline-lg text-headline-lg text-on-surface flex-1">${isSummary?'Workout Complete':esc(s.sequenceName)}</h2>
  </div>

  ${isSummary ? `
  <div class="bg-primary rounded-2xl p-space-lg text-on-primary shadow-sm flex flex-col items-center text-center gap-1 mb-space-md">
    ${icon('celebration','text-[32px]')}
    <h3 class="font-headline-lg text-headline-lg font-bold">${esc(s.sequenceName)}</h3>
    <p class="font-body-md text-body-md opacity-90">${fmtShort(s.date)} • ${fmtMinutes(s.durationSeconds)}</p>
  </div>` : `<p class="font-label-sm text-label-sm text-on-surface-variant -mt-2 mb-space-md">${fmtFull(s.date)} • Logged by ${esc(roleName(s.performedBy))}</p>`}

  <div class="grid grid-cols-4 gap-2 mb-space-md">
    ${[['Exercises', stats.exercisesDone+'/'+stats.exercisesTotal],['Working sets', stats.workingSets],['Drop sets', stats.dropSets],['Total reps', stats.totalReps]].map(([label,val])=>`
      <div class="bg-surface-container-lowest rounded-xl p-2.5 shadow-sm flex flex-col items-center justify-center text-center">
        <span class="font-numeric-metric text-numeric-metric text-on-surface">${val}</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">${label}</span>
      </div>`).join('')}
  </div>

  ${comparisons.length ? `
  <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm mb-space-md">
    <div class="flex items-center gap-2 mb-2">${icon('insights','text-[20px] text-on-surface-variant')}<h4 class="font-title-md text-title-md text-on-surface">${state.role===s.performedBy ? 'Your' : esc(roleName(s.performedBy)) + "'s"} Progress</h4></div>
    <div class="flex flex-col gap-1.5">
      ${comparisons.map(c=>`<p class="font-body-md text-body-md text-on-surface-variant flex items-start gap-1.5"><span class="${c.dir==='up'?'text-primary':'text-on-surface-variant'} flex-shrink-0 mt-0.5">${icon(c.dir==='up'?'trending_up':c.dir==='down'?'trending_down':'trending_flat','text-[16px]')}</span><span><span class="text-on-surface font-semibold">${esc(c.name)}:</span> ${esc(c.text)}</span></p>`).join('')}
    </div>
  </div>` : ''}

  ${state.role==='trainer' && !s.reviewedByTrainer ? `
  <div class="mb-space-md">
    <button data-action="mark-reviewed" data-id="${s.id}" class="w-full h-11 rounded-full bg-primary text-on-primary font-label-lg text-label-lg">Mark Reviewed</button>
  </div>` : ''}

  ${renderSessionTable(s)}

  ${isSummary ? `<a href="#/home" class="block text-center mt-space-lg h-12 leading-[48px] rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg">Back to Home</a>` : ''}
  `;
}

/* ================= HISTORY ================= */
function renderHistory() {
  const tab = state.ui.historyTab;
  return `
  <div class="flex items-center justify-between pt-2 mb-space-md">
    <h2 class="font-headline-lg text-headline-lg text-on-surface">History</h2>
  </div>
  <div class="bg-surface-container p-1 rounded-full flex items-center shadow-sm mb-space-md w-fit">
    <button data-action="history-tab" data-tab="sessions" class="px-4 py-1.5 rounded-full font-label-sm text-label-sm ${tab==='sessions'?'bg-surface-container-lowest text-on-surface shadow-sm':'text-on-surface-variant'}" type="button">Sessions</button>
    <button data-action="history-tab" data-tab="exercises" class="px-4 py-1.5 rounded-full font-label-sm text-label-sm ${tab==='exercises'?'bg-surface-container-lowest text-on-surface shadow-sm':'text-on-surface-variant'}" type="button">Exercises</button>
  </div>
  ${tab==='sessions' ? renderHistorySessions() : renderHistoryExercisePicker()}
  `;
}

function historyMonths() { return [...new Set(completedSessionsSorted().map(s => monthKey(s.date)))]; }
function renderHistorySessions() {
  const allSessions = completedSessionsSorted();
  const months = historyMonths();
  /* tolerate a missing/invalid saved filter (e.g. from an older app version) instead of crashing */
  const filterMonth = (state.ui.historyFilterMonth === 'all' || months.includes(state.ui.historyFilterMonth)) ? state.ui.historyFilterMonth : 'all';
  const list = allSessions.filter(s => filterMonth==='all' || monthKey(s.date)===filterMonth);
  const idx = months.indexOf(filterMonth);
  const canPrev = filterMonth !== 'all' && idx < months.length - 1;
  const canNext = filterMonth !== 'all' && idx > 0;
  return `
  <div class="flex items-center justify-center gap-3 mb-space-md">
    <button data-action="history-month-prev" ${canPrev?'':'disabled'} aria-label="Older month" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container disabled:opacity-30 disabled:pointer-events-none transition-colors" type="button">${icon('chevron_left','text-[20px]')}</button>
    <button data-action="history-month-toggle" class="h-9 px-4 rounded-full bg-surface-container text-on-surface font-label-md text-label-md font-semibold min-w-[130px] text-center" type="button">${filterMonth==='all' ? 'All Months' : monthLabel(filterMonth)}</button>
    <button data-action="history-month-next" ${canNext?'':'disabled'} aria-label="Newer month" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container disabled:opacity-30 disabled:pointer-events-none transition-colors" type="button">${icon('chevron_right','text-[20px]')}</button>
  </div>
  <div class="flex flex-col gap-space-sm">
    ${list.map(s => {
      const stats = sessionStats(s);
      return `
      <button data-action="go" data-href="#/history/session/${s.id}" class="w-full text-left bg-surface-container-lowest rounded-xl p-4 shadow-sm flex items-center justify-between gap-2" type="button">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-label-sm text-label-sm text-on-surface-variant">${fmtShort(s.date)}</span>
            <span class="w-1 h-1 rounded-full bg-outline-variant"></span>
            <span class="font-label-sm text-label-sm ${s.reviewedByTrainer?'text-primary':'text-tertiary'} font-bold">${s.reviewedByTrainer?'Reviewed':'Pending review'}</span>
          </div>
          <h4 class="font-title-md text-title-md text-on-surface font-semibold truncate">${esc(s.sequenceName)}</h4>

const PROGRESS_GRID_COLS = 'grid-cols-[1.2fr_1fr_0.9fr_1fr]';
function progressDelta(delta, unit) {
  if (delta == null || isNaN(delta) || delta === 0) return `<span class="block font-label-sm text-label-sm text-on-surface-variant">–</span>`;
  const good = delta > 0;
  return `<span class="block font-label-sm text-label-sm font-bold ${good ? 'text-primary' : 'text-on-surface-variant'}">${good ? '+' : ''}${delta}${unit || ''}</span>`;
}
function sideDeltaHtml(currL, prevL, currR, prevR) {
  const lD = (currL != null && prevL != null) ? round1(currL - prevL) : null;
  const rD = (currR != null && prevR != null) ? round1(currR - prevR) : null;
  if (lD == null && rD == null) return `<span class="block font-label-sm text-label-sm text-on-surface-variant">–</span>`;
  const fmt = (d) => d == null ? '–' : (d > 0 ? `+${d}` : `${d}`);
  const cls = (d) => (d != null && d > 0) ? 'text-primary font-bold' : 'text-on-surface-variant';
  return `<span class="block font-label-sm text-label-sm"><span class="${cls(lD)}">${fmt(lD)}</span> / <span class="${cls(rD)}">${fmt(rD)}</span></span>`;
}
function renderExerciseHistoryBody(exerciseId) {
  const ex = getExercise(exerciseId);
  const sessions = completedSessionsSorted().filter(s => s.exercises.some(e => e.exerciseId === exerciseId));
  if (!sessions.length) return `<p class="font-body-md text-body-md text-on-surface-variant">No logged history for this exercise yet.</p>`;
  const chronoAsc = [...sessions].reverse();
  const unit = ex.loadType === 'per_side' ? 'kg/side' : 'kg';

  const rows = sessions.map((s) => {
    const block = s.exercises.find(e => e.exerciseId === exerciseId);
    const flat = session_flatSets(block).filter(x => hasSetData(x.set));
    if (!flat.length) return '';
    const topRaw = topWorkingSet(block);
    const top = (topRaw && hasSetData(topRaw)) ? topRaw : flat[0].set;

    const ascIdx = chronoAsc.indexOf(s);
    const prevSession = ascIdx > 0 ? chronoAsc[ascIdx - 1] : null;
    const prevBlock = prevSession ? prevSession.exercises.find(e => e.exerciseId === exerciseId) : null;
    const prevTop = prevBlock ? topWorkingSet(prevBlock) : null;

    const isUni = ex.laterality === 'unilateral';
    const reps = isUni ? `L${top.repsLeft ?? '–'}/R${top.repsRight ?? '–'}` : `${top.reps ?? '–'}`;
    const weightDisplay = isUni ? `L${top.weightLeft ?? '–'}/R${top.weightRight ?? '–'}` : (top.weight ?? '–');
    const repsNum = repsOf(top), prevRepsNum = prevTop ? repsOf(prevTop) : null;
    const topW = weightOf(top), prevW = prevTop ? weightOf(prevTop) : null;
    const weightDelta = (prevTop && prevW != null && topW != null) ? round1(topW - prevW) : null;
    const repsDelta = (prevTop && prevRepsNum != null && repsNum != null) ? round1(repsNum - prevRepsNum) : null;
    const repsDeltaHtml = isUni && prevTop
      ? sideDeltaHtml(top.repsLeft, prevTop.repsLeft, top.repsRight, prevTop.repsRight)
      : progressDelta(repsDelta, '');
    const weightDeltaHtml = isUni && prevTop
      ? sideDeltaHtml(top.weightLeft, prevTop.weightLeft, top.weightRight, prevTop.weightRight)
      : progressDelta(weightDelta, unit);
    const rpeNow = intensityNum(top), rpePrev = prevTop ? intensityNum(prevTop) : null;
    const rpeDelta = (rpeNow != null && rpePrev != null) ? round1(rpeNow - rpePrev) : null;
    const rpeIsEasier = weightDelta === 0 && repsDelta === 0 && rpeDelta != null && rpeDelta < 0;
    const rpeDeltaHtml = isUni && prevTop
      ? sideDeltaHtml(intensityNum(top,'Left'), intensityNum(prevTop,'Left'), intensityNum(top,'Right'), intensityNum(prevTop,'Right'))
      : (rpeDelta != null && rpeDelta !== 0 ? `<span class="block font-label-sm text-label-sm ${rpeIsEasier?'text-primary font-bold':'text-on-surface-variant'}">${rpeDelta>0?'+':''}${rpeDelta}${rpeIsEasier?' (easier)':''}</span>` : `<span class="block font-label-sm text-label-sm text-on-surface-variant">–</span>`);

    const pr = isPR(exerciseId, top, s.date);
    const extra = flat.length - 1;
    const expanded = state.ui.expandedHistorySessionId === s.id;

    return `
    <button data-action="toggle-history-row" data-id="${s.id}" type="button" class="w-full grid ${PROGRESS_GRID_COLS} gap-2 px-3 py-3 border-t border-outline-variant/20 items-center hover:bg-surface-container-low/60 transition-colors text-left">
      <div class="min-w-0 flex items-center gap-1">
        ${icon(expanded?'expand_less':'expand_more','text-[18px] text-on-surface-variant flex-shrink-0')}
        <span class="min-w-0">
          <span class="font-label-md text-label-md text-on-surface font-semibold block">${fmtShort(s.date)}</span>
          ${extra > 0 ? `<span class="font-label-sm text-label-sm text-on-surface-variant">+${extra} more set${extra > 1 ? 's' : ''}</span>` : ''}
        </span>
      </div>
      <div class="min-w-0">
        <div class="flex items-baseline gap-1 flex-wrap">
          <span class="font-numeric-metric text-numeric-metric text-on-surface">${weightDisplay}</span>${!isUni ? `<span class="font-label-sm text-label-sm text-on-surface-variant">${unit}</span>` : ''}
          ${pr ? pill('PR', 'bg-tertiary-fixed text-on-tertiary-fixed-variant font-bold') : ''}
        </div>
        ${weightDeltaHtml}
      </div>
      <div class="min-w-0">
        <span class="font-numeric-metric text-numeric-metric text-on-surface">${reps}</span>
        ${repsDeltaHtml}
      </div>
      <div class="min-w-0">
        <span class="font-label-md text-label-md font-bold ${(isUni ? (top.intensityValueLeft==='failure'||top.intensityValueRight==='failure') : top.intensityValue==='failure')?'text-tertiary':'text-on-surface'}">${(isUni ? intensityLabelSides(top) : intensityLabel(top)) || '–'}</span>
        ${rpeDeltaHtml}
      </div>
    </button>
    ${expanded ? `
    <div class="px-3 pb-3 pt-1 border-t border-outline-variant/10 bg-surface-container-low/30">
      <div class="flex flex-col divide-y divide-outline-variant/20">
        ${prevSetRows(block)}
      </div>
      <a href="#/history/session/${s.id}" class="inline-flex items-center gap-1 mt-2 font-label-sm text-label-sm text-primary font-semibold">View full session${icon('arrow_forward','text-[14px]')}</a>
    </div>` : ''}`;
  }).join('');

  return `
  <div class="bg-surface-container-low rounded-xl p-3 mb-space-md flex items-center gap-3">
    <span class="font-label-sm text-label-sm text-on-surface-variant">${esc(ex.category)} • ${ex.laterality==='unilateral'?'Unilateral':'Bilateral'} • ${loadTypeLabel(ex.loadType)}</span>
  </div>
  <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden">
    <div class="grid ${PROGRESS_GRID_COLS} gap-2 px-3 py-2 bg-surface-container-low font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">
      <div>Date</div><div>Weight</div><div>Reps</div><div>RPE</div>
    </div>
    ${rows || `<p class="font-body-md text-body-md text-on-surface-variant p-4">No completed sets logged yet.</p>`}
  </div>
  <p class="font-label-sm text-label-sm text-on-surface-variant mt-2 px-1">Showing the top working set per workout. Tap a row for the full log, including drop sets.</p>
  `;
}

/* ================= FOCUS-PRESERVING RE-RENDER ================= */
function captureFocus() {
  const a = document.activeElement;
  if (!a || !(a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return null;
  let attr, key;
  if (a.hasAttribute('data-bind')) { attr = 'data-bind'; key = a.getAttribute('data-bind'); }
  else if (a.hasAttribute('data-action-input')) { attr = 'data-action-input'; key = a.getAttribute('data-action-input'); }
  else if (a.id) { attr = 'id'; key = a.id; }
  else return null;
  let selStart, selEnd;
  try { selStart = a.selectionStart; selEnd = a.selectionEnd; } catch (e) {}
  return { attr, key, selStart, selEnd };
}
function restoreFocus(info) {
  if (!info) return;
  const el = info.attr === 'id' ? document.getElementById(info.key) : document.querySelector(`[${info.attr}="${info.key.replace(/"/g,'\\"')}"]`);
  if (!el) return;
  el.focus();
  if (info.selStart != null) { try { el.setSelectionRange(info.selStart, info.selEnd); } catch (e) {} }
}
function rerender() { const f = captureFocus(); render(); restoreFocus(f); }
